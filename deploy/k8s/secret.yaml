# ─────────────────────────────────────────────────────────────────────────
#  TEMPLATE — DO NOT COMMIT REAL VALUES
# ─────────────────────────────────────────────────────────────────────────
#
# This is the secret-shape contract. Real values are populated AT THE
# CLUSTER, never in git. Two recommended patterns:
#
#   1. Sealed Secrets (bitnami/sealed-secrets) — encrypt this file with
#      kubeseal so the encrypted form is safe to commit.
#   2. External Secrets Operator + Azure Key Vault / AWS Secrets Manager —
#      replace this file with an `ExternalSecret` resource that pulls
#      from the vault at runtime.
#
# For the bootstrap operator who just wants to get the stack up, fill in
# the stringData values below, apply, and rotate later. `stringData`
# values are auto-base64-encoded by kubectl on apply.
#
# DATABASE_URL points at the in-cluster `timescaledb` service from
# services.yaml. REDIS_URL same shape. The frontend never sees these.

apiVersion: v1
kind: Secret
metadata:
  name: nexus-backend-secrets
  namespace: nexus-os
  labels:
    app.kubernetes.io/name: nexus-backend
    app.kubernetes.io/part-of: nexus-os
type: Opaque
stringData:
  # ── Infrastructure DSNs (point at in-cluster services) ─────────────
  DATABASE_URL: "postgresql://nexus_admin:CHANGE_ME@timescaledb:5432/nexus_os"
  REDIS_URL:    "redis://redis:6379/0"

  # ── Korea Investment & Securities (KIS) OpenAPI ────────────────────
  KIS_APP_KEY:        ""
  KIS_APP_SECRET:     ""
  KIS_ACCOUNT_NUMBER: ""

  # ── Microsoft Entra ID (OIDC) ──────────────────────────────────────
  ENTRA_TENANT_ID:    ""
  ENTRA_CLIENT_ID:    ""
  ENTRA_AUDIENCE:     ""

---
# Postgres root credentials, kept SEPARATE from the API secret so the API
# pod never sees them. Only the timescaledb StatefulSet mounts this.
apiVersion: v1
kind: Secret
metadata:
  name: timescaledb-credentials
  namespace: nexus-os
  labels:
    app.kubernetes.io/name: timescaledb
    app.kubernetes.io/part-of: nexus-os
type: Opaque
stringData:
  POSTGRES_USER:     "nexus_admin"
  POSTGRES_PASSWORD: "CHANGE_ME"
  POSTGRES_DB:       "nexus_os"
