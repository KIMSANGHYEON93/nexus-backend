# Redis — pub/sub fan-out broker.
#
# Plain Deployment (not StatefulSet) because:
#   • The pub/sub channel is ephemeral by design — subscribers reconnect on
#     pod restart and resume the live stream from the upstream KIS adapter.
#     There is no message replay requirement, so persistence is unnecessary.
#   • A 1-replica Deployment with no PVC restarts in seconds; a StatefulSet
#     here would buy us nothing but storage cost and slower failovers.
#
# If we ever need persisted streams (Redis Streams XADD with retention),
# upgrade to a StatefulSet + PVC — this manifest is intentionally cheap.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: nexus-os
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/part-of: nexus-os
spec:
  replicas: 1
  strategy:
    type: Recreate           # avoid two replicas during rollout — pub/sub
                              # subscribers would split-brain across them.
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis
        app.kubernetes.io/part-of: nexus-os
    spec:
      terminationGracePeriodSeconds: 10
      containers:
        - name: redis
          image: redis:7-alpine
          imagePullPolicy: IfNotPresent
          args: ["redis-server", "--save", "", "--appendonly", "no"]
          ports:
            - name: redis
              containerPort: 6379
              protocol: TCP
          # `redis-cli ping` returns PONG when the server is accepting
          # commands — same signal the Python client uses on init_client().
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu:    "50m"
              memory: "64Mi"
            limits:
              cpu:    "500m"
              memory: "256Mi"
